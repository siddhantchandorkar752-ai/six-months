<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>A Question for Amisha 💕</title>
<style>
  :root {
    --pink-light: #ffd6e8;
    --pink-mid: #ff8fb3;
    --pink-deep: #ff5c8d;
    --white: #fff7fa;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow-x: hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, var(--white) 0%, var(--pink-light) 50%, #ffe3ee 100%);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* ---------- Floating hearts background ---------- */
  .hearts-bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
  }

  .float-heart {
    position: absolute;
    bottom: -10%;
    color: var(--pink-mid);
    opacity: 0.55;
    animation: floatUp linear infinite;
    user-select: none;
  }

  @keyframes floatUp {
    0% {
      transform: translateY(0) translateX(0) rotate(0deg) scale(1);
      opacity: 0;
    }
    10% {
      opacity: 0.6;
    }
    50% {
      transform: translateY(-55vh) translateX(15px) rotate(15deg) scale(1.05);
    }
    90% {
      opacity: 0.5;
    }
    100% {
      transform: translateY(-110vh) translateX(-15px) rotate(-10deg) scale(0.9);
      opacity: 0;
    }
  }

  /* ---------- Main card ---------- */
  .card {
    position: relative;
    z-index: 5;
    background: rgba(255, 255, 255, 0.55);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, 0.7);
    border-radius: 32px;
    padding: 50px 35px;
    max-width: 560px;
    width: 90%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(255, 92, 141, 0.25), inset 0 0 40px rgba(255,255,255,0.4);
    animation: cardIn 0.9s ease-out;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(30px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .big-heart {
    font-size: 2.6rem;
    animation: pulse 1.4s ease-in-out infinite;
    display: inline-block;
    margin-bottom: 6px;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.18); }
  }

  .question {
    font-size: clamp(1.4rem, 5vw, 2.1rem);
    color: #c2376b;
    font-weight: 700;
    line-height: 1.5;
    margin: 10px 0 40px;
    text-shadow: 0 2px 10px rgba(255,255,255,0.8);
  }

  .question .accent {
    color: var(--pink-deep);
  }

  /* ---------- Button area ---------- */
  .btn-row {
    position: relative;
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    justify-content: center;
    align-items: center;
    min-height: 160px;
  }

  .btn {
    border: none;
    border-radius: 50px;
    padding: 18px 42px;
    font-size: clamp(1.05rem, 3.5vw, 1.3rem);
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .btn:active {
    transform: scale(0.96);
  }

  #yesBtn {
    background: linear-gradient(135deg, #ff8fb3, #ff5c8d);
    color: #fff;
    animation: glow 2s ease-in-out infinite;
  }

  #yesBtn:hover {
    transform: scale(1.07);
    box-shadow: 0 14px 30px rgba(255, 92, 141, 0.5);
  }

  @keyframes glow {
    0%, 100% { box-shadow: 0 10px 25px rgba(255,92,141,0.35); }
    50% { box-shadow: 0 10px 40px rgba(255,92,141,0.65); }
  }

  #noBtn {
    background: linear-gradient(135deg, #f1f1f1, #d8d8d8);
    color: #555;
    position: relative;
    transition: top 0.35s ease, left 0.35s ease, transform 0.15s ease;
  }

  /* When the No button goes "fixed" to dodge across the whole viewport */
  #noBtn.escaping {
    position: fixed;
    z-index: 50;
  }

  .hint {
    margin-top: 26px;
    font-size: 0.85rem;
    color: #b85c7d;
    opacity: 0.8;
  }

  /* ---------- Full-screen success overlay ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, #fff0f5 0%, #ffd6e8 60%, #ffb6cf 100%);
    text-align: center;
    padding: 20px;
    overflow: hidden;
  }

  .overlay.show {
    display: flex;
    animation: fadeIn 0.6s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .overlay-content {
    position: relative;
    z-index: 5;
    max-width: 600px;
  }

  .overlay-emoji {
    font-size: clamp(3rem, 12vw, 5rem);
    animation: bounce 1.2s ease-in-out infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-18px) rotate(3deg); }
  }

  .overlay-text {
    font-size: clamp(1.3rem, 5vw, 2.1rem);
    color: #c2376b;
    font-weight: 800;
    line-height: 1.6;
    margin-top: 20px;
    text-shadow: 0 3px 12px rgba(255,255,255,0.9);
  }

  .overlay-sub {
    margin-top: 18px;
    font-size: clamp(0.95rem, 3vw, 1.15rem);
    color: #a8456c;
  }

  /* floating hearts inside overlay */
  .overlay-heart {
    position: absolute;
    bottom: -10%;
    color: var(--pink-deep);
    animation: floatUp linear infinite;
    pointer-events: none;
  }

  /* confetti */
  .confetti-piece {
    position: absolute;
    top: -10px;
    width: 10px;
    height: 16px;
    opacity: 0.9;
    animation: confettiFall linear forwards;
    pointer-events: none;
  }

  @keyframes confettiFall {
    0% {
      transform: translateY(0) rotate(0deg);
      opacity: 1;
    }
    100% {
      transform: translateY(110vh) rotate(720deg);
      opacity: 0.3;
    }
  }

  @media (max-width: 480px) {
    .card { padding: 38px 20px; border-radius: 24px; }
    .btn { padding: 15px 32px; }
    .btn-row { min-height: 200px; }
  }
</style>
</head>
<body>

  <div class="hearts-bg" id="heartsBg"></div>

  <div class="card">
    <div class="big-heart">💗</div>
    <div class="question">
      Amisha <span class="accent">❤️</span>, can I have one more girlfriend? 🥺
    </div>

    <div class="btn-row" id="btnRow">
      <button class="btn" id="yesBtn">Yes 😊</button>
      <button class="btn" id="noBtn">No 😤</button>
    </div>

    <div class="hint">psst... try clicking "No" 👀</div>
  </div>

  <div class="overlay" id="overlay">
    <div class="overlay-content">
      <div class="overlay-emoji">😂🥰</div>
      <div class="overlay-text">
        😂 Relax, Amisha!<br>It was just a prank.<br>You are my one and only. ❤️🥰
      </div>
      <div class="overlay-sub">Now come here, I owe you a hug 🤗</div>
    </div>
  </div>

<script>
  // ---------------- Floating hearts background ----------------
  const heartsBg = document.getElementById('heartsBg');
  const heartEmojis = ['❤️', '💕', '💖', '💗', '💓', '🩷'];

  function spawnFloatingHeart(container, sizeMin, sizeMax) {
    const heart = document.createElement('span');
    heart.className = 'float-heart';
    heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
    const size = (Math.random() * (sizeMax - sizeMin) + sizeMin).toFixed(1);
    heart.style.fontSize = size + 'rem';
    heart.style.left = Math.random() * 100 + '%';
    const duration = (Math.random() * 6 + 7).toFixed(1);
    heart.style.animationDuration = duration + 's';
    heart.style.animationDelay = (Math.random() * 4) + 's';
    container.appendChild(heart);

    setTimeout(() => {
      heart.remove();
      spawnFloatingHeart(container, sizeMin, sizeMax);
    }, (parseFloat(duration) + parseFloat(heart.style.animationDelay)) * 1000);
  }

  for (let i = 0; i < 18; i++) {
    spawnFloatingHeart(heartsBg, 1.2, 2.4);
  }

  // ---------------- Evasive "No" button ----------------
  const noBtn = document.getElementById('noBtn');
  const yesBtn = document.getElementById('yesBtn');
  const btnRow = document.getElementById('btnRow');
  const overlay = document.getElementById('overlay');

  const DODGE_RADIUS = 110;

  function escapeButton() {
    const btnWidth = noBtn.offsetWidth;
    const btnHeight = noBtn.offsetHeight;
    const margin = 16;

    const maxX = window.innerWidth - btnWidth - margin;
    const maxY = window.innerHeight - btnHeight - margin;

    const newX = Math.max(margin, Math.random() * maxX);
    const newY = Math.max(margin, Math.random() * maxY);

    if (!noBtn.classList.contains('escaping')) {
      noBtn.classList.add('escaping');
    }

    noBtn.style.left = newX + 'px';
    noBtn.style.top = newY + 'px';
  }

  function distance(x1, y1, x2, y2) {
    return Math.hypot(x1 - x2, y1 - y2);
  }

  function checkProximity(clientX, clientY) {
    const rect = noBtn.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    const d = distance(clientX, clientY, centerX, centerY);
    if (d < DODGE_RADIUS) {
      escapeButton();
    }
  }

  document.addEventListener('mousemove', (e) => {
    checkProximity(e.clientX, e.clientY);
  });

  document.addEventListener('touchstart', (e) => {
    const touch = e.touches[0];
    checkProximity(touch.clientX, touch.clientY);
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    const touch = e.touches[0];
    checkProximity(touch.clientX, touch.clientY);
  }, { passive: true });

  noBtn.addEventListener('click', (e) => {
    e.preventDefault();
    escapeButton();
  });

  noBtn.addEventListener('mouseenter', escapeButton);
  noBtn.addEventListener('touchend', (e) => {
    e.preventDefault();
    escapeButton();
  });

  window.addEventListener('resize', () => {
    if (noBtn.classList.contains('escaping')) {
      escapeButton();
    }
  });

  // ---------------- Yes button -> celebration ----------------
  function spawnConfetti() {
    const colors = ['#ff5c8d', '#ff8fb3', '#ffd6e8', '#fff7fa', '#ff3366', '#ffb6cf'];
    const count = 80;
    for (let i = 0; i < count; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = Math.random() * 100 + '%';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDuration = (Math.random() * 2 + 2.5) + 's';
      piece.style.animationDelay = (Math.random() * 0.6) + 's';
      piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      overlay.appendChild(piece);
      setTimeout(() => piece.remove(), 6000);
    }
  }

  function spawnOverlayHearts() {
    for (let i = 0; i < 14; i++) {
      const h = document.createElement('span');
      h.className = 'overlay-heart';
      h.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
      h.style.left = Math.random() * 100 + '%';
      h.style.fontSize = (Math.random() * 1.5 + 1.2) + 'rem';
      h.style.animationDuration = (Math.random() * 5 + 6) + 's';
      h.style.animationDelay = (Math.random() * 3) + 's';
      overlay.appendChild(h);
    }
  }

  yesBtn.addEventListener('click', () => {
    overlay.classList.add('show');
    spawnConfetti();
    spawnOverlayHearts();
    let bursts = 0;
    const burstInterval = setInterval(() => {
      spawnConfetti();
      bursts++;
      if (bursts >= 3) clearInterval(burstInterval);
    }, 1200);
  });
</script>

</body>
</html>
